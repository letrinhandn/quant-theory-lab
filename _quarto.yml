project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - posts/**/index.qmd

website:
  title: "Quant Theory Lab"
  description: "Essays on quantitative finance theory by Le Tri Nhan"
  site-url: https://letrinhandn.github.io/quant-theory-lab
  repo-url: https://github.com/letrinhandn/quant-theory-lab
  favicon: styles/favicon.svg
  navbar:
    background: primary
    foreground: light
    left:
      - text: Notebooks
        menu:
          - text: Personal site
            href: https://letrinhan-site.vercel.app/
          - text: Economic Lab
            href: https://letrinhandn.github.io/economic-lab/
          - text: Quant Theory Lab
            href: https://letrinhandn.github.io/quant-theory-lab/
          - text: Investment Research Lab
            href: https://letrinhandn.github.io/investment-research-lab/
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/letrinhandn/quant-theory-lab
      - icon: twitter
        href: https://x.com/comrade_lenhan
  page-footer:
    left: "Le Tri Nhan"
    center: "[Personal site](https://letrinhan-site.vercel.app/)  [EL](https://letrinhandn.github.io/economic-lab/)  [IRL](https://letrinhandn.github.io/investment-research-lab/)"
    right: "Research only"
  search: true
  draft-mode: gone

format:
  html:
    theme:
      - flatly
      - styles/quarto.scss
    toc: true
    toc-depth: 3
    toc-location: right
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    link-external-newwindow: true
    mainfont: "Be Vietnam Pro"
    respect-user-color-scheme: false

execute:
  freeze: auto
