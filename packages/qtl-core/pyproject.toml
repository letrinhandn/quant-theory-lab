[project]
name = "qtl-core"
version = "0.1.0"
description = "Core paths, domains, and settings"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtl_core"]
